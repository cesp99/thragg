[package]
name = "gpui"
version = "0.2.2"
edition.workspace = true
authors = ["Nathan Sobo <nathan@zed.dev>"]
description = "Zed's GPU-accelerated UI framework"
repository = "https://github.com/zed-industries/zed"
publish = true
license = "Apache-2.0"
homepage = "https://gpui.rs"
readme = "README.md"
keywords = ["desktop", "gui", "immediate"]
categories = ["gui"]

[lints]
workspace = true

[features]
# THRAGG PATCH: dropped "windows-manifest" — its `embed-resource`
# build-dependency went away with the other build/dev dependencies.
default = ["font-kit", "wayland", "x11"]
test-support = [
    "leak-detection",
    "collections/test-support",
    "http_client/test-support",
    "wayland",
    "x11",
    "proptest",
]
bench = ["test-support", "profiler", "dep:criterion"]
# THRAGG PATCH: image decoding and SVG rasterization live behind this
# off-by-default feature. The engine drives gpui as a headless runtime — no
# build of this app ever decodes an image or rasterizes an SVG — and the image
# codecs plus resvg/usvg/ttf-parser are pure dead weight in the shipped .so.
# `image` itself stays a required dependency: RenderImage and the paint API use
# its codec-free core types (Frame/Delay/RgbaImage). The list mirrors the
# workspace `image` pin (default features minus "avif").
images = [
    "dep:resvg",
    "dep:usvg",
    "dep:ttf-parser",
    "image/bmp",
    "image/dds",
    "image/exr",
    "image/ff",
    "image/gif",
    "image/hdr",
    "image/ico",
    "image/jpeg",
    "image/png",
    "image/pnm",
    "image/qoi",
    "image/rayon",
    "image/tga",
    "image/tiff",
    "image/webp",
]
inspector = ["gpui_macros/inspector"]
leak-detection = ["backtrace"]
wayland = []
x11 = [
    "scap?/x11",
]
screen-capture = [
    "scap",
]
profiler = ["dep:hdrhistogram"]

# THRAGG PATCH: inline tests are off — they need the dev-dependencies
# stripped when vendoring (see VENDOR.md). Tier-0 crates keep theirs.
[lib]
test = false
path = "src/gpui.rs"
doctest = false

[dependencies]
accesskit.workspace = true
anyhow.workspace = true
async-task.workspace = true
backtrace = { workspace = true, optional = true }
bitflags.workspace = true

collections.workspace = true
criterion = { workspace = true, optional = true }
ctor.workspace = true
derive_more.workspace = true
etagere.workspace = true
futures.workspace = true
futures-concurrency.workspace = true
gpui_macros.workspace = true
gpui_shared_string.workspace = true
http_client.workspace = true
# THRAGG PATCH: codec-free — the workspace pin's codec features move into
# the off-by-default "images" feature above.
image = { version = "0.25.1", default-features = false }
inventory.workspace = true
itertools.workspace = true
log.workspace = true
num_cpus = "1.13"
parking = "2.0.0"
parking_lot.workspace = true
postage.workspace = true
proptest = { workspace = true, optional = true }
chrono.workspace = true
profiling.workspace = true
rand.workspace = true
raw-window-handle.workspace = true
regex.workspace = true
refineable.workspace = true
scheduler.workspace = true
# THRAGG PATCH: optional, behind the off-by-default "images" feature.
resvg = { workspace = true, optional = true }
usvg = { workspace = true, optional = true }
ttf-parser = { version = "0.25", optional = true }
util_macros.workspace = true
schemars.workspace = true
seahash = "4.1"
serde.workspace = true
serde_json.workspace = true
slotmap.workspace = true
smallvec.workspace = true
async-channel.workspace = true
stacksafe.workspace = true
strum.workspace = true
sum_tree.workspace = true
taffy = "=0.13.0"
thiserror.workspace = true
tracing.workspace = true
gpui_util.workspace = true
hdrhistogram = { workspace = true, optional = true }
waker-fn = "1.2.0"
lyon = "1.0"
pin-project = "1.1.10"
spin = "0.10.0"
pollster.workspace = true
url.workspace = true
uuid.workspace = true
web-time.workspace = true
heapless.workspace = true
ztracing.workspace = true

[target.'cfg(target_family = "wasm")'.dependencies]
getrandom = { version = "0.3.4", features = ["wasm_js"] }
uuid = { workspace = true, features = ["js"] }

[target.'cfg(target_os = "macos")'.dependencies]
block.workspace = true
cocoa.workspace = true
cocoa-foundation.workspace = true
core-foundation.workspace = true
core-foundation-sys.workspace = true
core-graphics.workspace = true
core-video.workspace = true
core-text.workspace = true
# WARNING: If you change this, you must also publish a new version of zed-font-kit to crates.io
font-kit = { git = "https://github.com/zed-industries/font-kit", rev = "94b0f28166665e8fd2f53ff6d268a14955c82269", package = "zed-font-kit", version = "0.14.1-zed", optional = true }
foreign-types.workspace = true
log.workspace = true
media.workspace = true
objc.workspace = true
objc2 = { workspace = true, optional = true }
objc2-metal = { version = "0.3", optional = true }
mach2.workspace = true
#TODO: replace with "objc2"
metal.workspace = true

[target.'cfg(any(target_os = "linux", target_os = "freebsd", target_os = "macos"))'.dependencies]
pathfinder_geometry.workspace = true

[target.'cfg(any(target_os = "linux", target_os = "freebsd", target_os = "windows"))'.dependencies]
scap = { workspace = true, optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, features = ["Win32_Foundation", "Win32_System_Power"] }

[package.metadata.cargo-machete]
ignored = ["tracing"]
