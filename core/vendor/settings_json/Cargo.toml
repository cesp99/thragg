[package]
name = "settings_json"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"

[lints]
workspace = true

# THRAGG PATCH: inline tests are off — they need the dev-dependencies
# stripped when vendoring (see VENDOR.md). Tier-0 crates keep theirs.
[lib]
test = false
doctest = false
path = "src/settings_json.rs"

[features]
default = []

[dependencies]
anyhow.workspace = true
# THRAGG PATCH: the "wasm" feature is dropped — it pulls the whole
# Cranelift/Wasmtime stack into the .so for a .wasm-grammar path this app
# never takes (all grammars are statically linked via `grammars`).
tree-sitter.workspace = true
tree-sitter-json.workspace = true
util.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_json_lenient.workspace = true
serde_path_to_error.workspace = true
