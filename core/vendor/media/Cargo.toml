[package]
name = "media"
version = "0.1.0"
edition.workspace = true
publish = false
license = "Apache-2.0"
description = "Bindings to macos media handling APIs for Zed"

[lints]
workspace = true

# THRAGG PATCH: inline tests are off — they need the dev-dependencies
# stripped when vendoring (see VENDOR.md). Tier-0 crates keep theirs.
[lib]
test = false
path = "src/media.rs"
doctest = false

[dependencies]
anyhow.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation.workspace = true
ctor.workspace = true
foreign-types.workspace = true
metal.workspace = true
core-video.workspace = true
objc.workspace = true
