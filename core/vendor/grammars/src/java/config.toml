name = "Java"
grammar = "java"
path_suffixes = ["java"]
line_comments = ["// "]
block_comment = { start = "/*", prefix = "* ", end = "*/", tab_size = 1 }
documentation_comment = { start = "/**", prefix = "* ", end = "*/", tab_size = 1 }
autoclose_before = ";:.,=}])>"
brackets = [
    { start = "{", end = "}", close = true, surround = true, newline = true },
    { start = "[", end = "]", close = true, surround = true, newline = true },
    { start = "(", end = ")", close = true, surround = true, newline = true },
    { start = "<", end = ">", close = false, surround = true, newline = true, not_in = ["string", "comment"] },
    { start = "\"", end = "\"", close = true, surround = true, newline = false, not_in = ["string", "comment"] },
    { start = "'", end = "'", close = true, surround = true, newline = false, not_in = ["string", "comment"] },
    { start = "/*", end = " */", close = true, surround = false, newline = false, not_in = ["string", "comment"] },
]
tab_size = 4
code_fence_block_name = "java"
