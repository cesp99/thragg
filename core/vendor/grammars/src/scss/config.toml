name = "SCSS"
grammar = "scss"
path_suffixes = ["scss", "sass"]
line_comments = ["// "]
block_comment = { start = "/*", prefix = "* ", end = "*/", tab_size = 1 }
autoclose_before = ";:.,=}])>"
brackets = [
    { start = "{", end = "}", close = true, surround = true, newline = true },
    { start = "[", end = "]", close = true, surround = true, newline = true },
    { start = "(", end = ")", close = true, surround = true, newline = true },
    { start = "\"", end = "\"", close = true, surround = true, newline = false, not_in = ["string", "comment"] },
    { start = "'", end = "'", close = true, surround = true, newline = false, not_in = ["string", "comment"] },
]
completion_query_characters = ["-", "@", "$"]
word_characters = ["#", "$", "-"]
tab_size = 2
code_fence_block_name = "scss"
prettier_parser_name = "scss"
