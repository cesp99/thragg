name = "TOML"
grammar = "toml"
path_suffixes = ["toml", "Cargo.lock", "poetry.lock", "uv.lock", "pdm.lock"]
line_comments = ["# "]
autoclose_before = ",]}"
brackets = [
    { start = "{", end = "}", close = true, surround = true, newline = true },
    { start = "[", end = "]", close = true, surround = true, newline = true },
    { start = "\"", end = "\"", close = true, surround = true, newline = false, not_in = ["string", "comment"] },
    { start = "'", end = "'", close = true, surround = true, newline = false, not_in = ["string", "comment"] },
]
tab_size = 2
code_fence_block_name = "toml"
