notify-types = { git = "https://github.com/zed-industries/notify", rev = "0890bbb8ca40a4b5d1f67031698dd7918b37d991" }
# SEEKER PATCH: Zed's trash-rs fork has no Android backend; crates/trash-android
# implements the tiny API surface `fs` uses by moving entries to an app-private
# .trash directory.
[patch."https://github.com/zed-industries/trash-rs"]
trash = { path = "crates/trash-android" }

[profile.release]
# Fat LTO over one codegen unit trades compile time for the smallest, fastest
# .so. panic = "abort" drops the unwinding machinery; a panic on any engine
# thread now kills the whole process — the jni-bridge panic hook still logs it
# to logcat first.
codegen-units = 1
lto = "fat"
opt-level = 3
panic = "abort"
strip = "symbols"

[profile.release.package.grammars]
# The statically linked tree-sitter parse tables gain nothing from O3 and are
# a large share of the binary; optimize them for size.
opt-level = "s"

[profile.dev]
# Keep dev builds fast but usable on device.
opt-level = 1

[profile.dev.package]
# Vendored crates rarely change and are painfully slow unoptimized.
"*" = { opt-level = 2 }
