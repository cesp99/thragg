[workspace]
resolver = "2"
members = [
    "crates/engine",
    "crates/jni-bridge",
    "crates/tree-sitter-dockerfile",
    "crates/trash-android",
    "vendor/askpass",
    "vendor/clock",
    "vendor/cloud_llm_client",
    "vendor/collections",
    "vendor/fs",
    "vendor/fuzzy",
    "vendor/fuzzy_nucleo",
    "vendor/git",
    "vendor/gpui",
    "vendor/gpui_macros",
    "vendor/gpui_shared_string",
    "vendor/gpui_util",
    "vendor/grammars",
    "vendor/http_client",
    "vendor/language",
    "vendor/language_core",
    "vendor/language_model_core",
    "vendor/lsp",
    "vendor/media",
    "vendor/migrator",
    "vendor/net",
    "vendor/path",
    "vendor/paths",
    "vendor/perf",
    "vendor/proto",
    "vendor/refineable",
    "vendor/release_channel",
    "vendor/rope",
    "vendor/rpc",
    "vendor/scheduler",
    "vendor/settings",
    "vendor/settings_content",
    "vendor/settings_json",
    "vendor/settings_macros",
    "vendor/sum_tree",
    "vendor/syntax_theme",
    "vendor/task",
    "vendor/telemetry",
    "vendor/telemetry_events",
    "vendor/text",
    "vendor/theme",
    "vendor/util",
    "vendor/util_macros",
    "vendor/watch",
    "vendor/worktree",
    "vendor/zed_actions",
    "vendor/zeta_prompt",
    "vendor/zlog",
    "vendor/ztracing",
    "vendor/ztracing_macro",
    "vendor/refineable/derive_refineable",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
license = "GPL-3.0-or-later"
repository = "https://github.com/cesp99/thragg"

[workspace.lints.rust]
unexpected_cfgs = { level = "allow" }

[workspace.dependencies]
# Our crates
engine = { path = "crates/engine" }

# App-side (non-Zed) dependencies
jni = "0.21"
android_logger = "0.14"

# Vendored Zed crates + the external pins they need. Both lists mirror Zed's
# workspace Cargo.toml at the commit in vendor/VENDOR.md — keep them in sync
# when syncing vendor/.

#
# Workspace member crates
#

askpass = { path = "vendor/askpass" }
clock = { path = "vendor/clock" }
cloud_llm_client = { path = "vendor/cloud_llm_client" }
collections = { path = "vendor/collections", version = "0.1.0" }
console = "0.16"
crossbeam = "0.8.4"
derive_refineable = { path = "vendor/refineable/derive_refineable" }
dialoguer = { version = "0.12", default-features = false }
fs = { path = "vendor/fs" }
fuzzy = { path = "vendor/fuzzy" }
fuzzy_nucleo = { path = "vendor/fuzzy_nucleo" }
git = { path = "vendor/git" }
grammars = { path = "vendor/grammars" }
gpui = { path = "vendor/gpui", default-features = false }
gpui_shared_string = { path = "vendor/gpui_shared_string" }
gpui_macros = { path = "vendor/gpui_macros" }
gpui_util = { path = "vendor/gpui_util" }
http_client = { path = "vendor/http_client" }
language = { path = "vendor/language" }
language_core = { path = "vendor/language_core" }
language_model_core = { path = "vendor/language_model_core" }
lsp = { path = "vendor/lsp" }
media = { path = "vendor/media" }
mime = "0.3.17"
migrator = { path = "vendor/migrator" }
net = { path = "vendor/net" }
paths = { path = "vendor/paths" }
path = { path = "vendor/path" }
perf = { path = "vendor/perf" }
proto = { path = "vendor/proto" }
refineable = { path = "vendor/refineable" }
release_channel = { path = "vendor/release_channel" }
rodio = { git = "https://github.com/RustAudio/rodio", rev = "e50e726ddd0292f6ef9de0dda6b90af4ed1fb66a", features = ["wav", "playback", "wav_output", "recording"] }
rope = { path = "vendor/rope" }
rpc = { path = "vendor/rpc" }
scheduler = { path = "vendor/scheduler" }
settings = { path = "vendor/settings" }
settings_content = { path = "vendor/settings_content" }
settings_json = { path = "vendor/settings_json" }
settings_macros = { path = "vendor/settings_macros" }
sum_tree = { path = "vendor/sum_tree" }
syntax_theme = { path = "vendor/syntax_theme" }
task = { path = "vendor/task" }
telemetry = { path = "vendor/telemetry" }
telemetry_events = { path = "vendor/telemetry_events" }
text = { path = "vendor/text" }
theme = { path = "vendor/theme" }
util = { path = "vendor/util" }
util_macros = { path = "vendor/util_macros" }

watch = { path = "vendor/watch" }
worktree = { path = "vendor/worktree" }
zed_actions = { path = "vendor/zed_actions" }
zeta_prompt = { path = "vendor/zeta_prompt" }
zlog = { path = "vendor/zlog" }
ztracing = { path = "vendor/ztracing" }
ztracing_macro = { path = "vendor/ztracing_macro" }

