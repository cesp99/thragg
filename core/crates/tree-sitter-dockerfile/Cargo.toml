[package]
name = "tree-sitter-dockerfile"
version = "0.2.0"
edition.workspace = true
publish.workspace = true
license = "MIT"
description = """
Thragg's binding for camdencheek/tree-sitter-dockerfile. The published
crate still pins tree-sitter 0.20, whose `Language` is a different Rust type
from the 0.26 the rest of the workspace uses, so the generated parser sources
are vendored here and exposed as a `LanguageFn` like every other grammar.
"""

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
tree-sitter-language.workspace = true

[build-dependencies]
cc.workspace = true
